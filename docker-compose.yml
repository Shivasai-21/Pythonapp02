version: "3.8"
services:
  chatapp:
    build: .
    ports:
      - "3434:5000"
    depends_on:
      - mongo
  mongo:
    image: mongo:5.0
    container_name: chat-mongo
    ports:
      - "27017:27017"
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - chatapp
