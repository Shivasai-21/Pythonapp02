services:
  pythonapp02-chatapp:
    build: .
    ports:
      - "3434:5000"
    depends_on:
      - chat-mongo

  chat-mongo:
    image: mongo:5.0
    ports:
      - "27017:27017"

  pythonapp02-nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pythonapp02-chatapp

